<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>False-positive adjudication</title>
<style>
 *{box-sizing:border-box}
 body{font:14px/1.5 system-ui,sans-serif;margin:0;background:#14161a;color:#e8eaed;
      padding-bottom:190px}
 header{padding:8px 18px;background:#1d2026;border-bottom:1px solid #2c3039;
        display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px}
 .pill{padding:2px 9px;border-radius:99px;font-size:12px;background:#242832;border:1px solid #3a3f4b}
 .done{color:#6bbf7b}.todo{color:#c9a227}
 #bar{height:4px;background:#2c3039}#fill{height:100%;background:#4b8dd6;width:0;transition:width .15s}
 #meta{font-family:ui-monospace,monospace;font-size:12px;color:#9aa0ab;text-align:center;padding:8px}
 #img{display:block;max-width:100%;max-height:calc(100vh - 330px);margin:0 auto;background:#000;border-radius:6px}
 footer{position:fixed;bottom:0;left:0;right:0;background:#1d2026;border-top:1px solid #2c3039;
        padding:12px 18px 14px;display:flex;flex-direction:column;gap:10px;align-items:center}
 .row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
 .big{padding:18px 30px;font-size:19px;font-weight:650;border-radius:10px;cursor:pointer;
      border:2px solid #3a3f4b;background:#242832;color:#e8eaed;min-width:210px}
 .big:hover{filter:brightness(1.25)}
 .A{border-color:#2e7d4f;background:#1e3328}.B{border-color:#9b3b3b;background:#331e1e}
 .C{border-color:#8a7320;background:#332d1a}
 .sel{outline:3px solid #4b8dd6;outline-offset:2px}
 .nav{padding:12px 18px;font-size:15px;border-radius:8px;border:1px solid #3a3f4b;
      background:#242832;color:#e8eaed;cursor:pointer}
 #note{flex:1;min-width:320px;max-width:760px;padding:11px 13px;font-size:15px;border-radius:8px;
       border:1px solid #3a3f4b;background:#101216;color:#e8eaed}
 #note:focus{outline:2px solid #4b8dd6;border-color:#4b8dd6}
 kbd{background:#2a2e38;border:1px solid #3a3f4b;border-radius:4px;padding:1px 6px;font-size:12px}
 #cur{text-align:center;font-weight:600;padding-bottom:4px}
</style>

<header>
  <strong>FP adjudication</strong>
  <span class="pill" id="pos">0 / 0</span>
  <span class="pill"><span class="done" id="ndone">0</span> labelled · <span class="todo" id="ntodo">0</span> left</span>
  <span style="flex:1"></span>
  <button class="nav" onclick="dump()">Download CSV</button>
  <button class="nav" onclick="if(confirm('Clear all labels and comments?')){L={};C={};save();render()}">Reset</button>
</header>
<div id="bar"><div id="fill"></div></div>

<div id="meta"></div>
<img id="img">
<div id="cur"></div>

<footer>
  <div class="row">
    <input id="note" placeholder="Comment (optional) — e.g. bend contour, grain boundary, too faint to call…"
           oninput="C[M[i].id]=this.value;save()">
  </div>
  <div class="row">
    <button class="big A" id="bA" onclick="mark('A')">A · RIGHT <kbd>a</kbd></button>
    <button class="big B" id="bB" onclick="mark('B')">B · WRONG <kbd>b</kbd></button>
    <button class="big C" id="bC" onclick="mark('C')">C · NOT SURE <kbd>c</kbd></button>
    <button class="nav" onclick="go(-1)">← prev</button>
    <button class="nav" onclick="go(1)">next →</button>
  </div>
</footer>

<script>
let M=[],i=0,L={},C={};
const KL='fp_review_labels', KC='fp_review_comments';
fetch('manifest.json').then(r=>r.json()).then(d=>{
  M=d; L=JSON.parse(localStorage.getItem(KL)||'{}'); C=JSON.parse(localStorage.getItem(KC)||'{}');
  i=M.findIndex(m=>!(m.id in L)); if(i<0)i=0; render();
}).catch(()=>{document.getElementById('meta').textContent='Could not load manifest.json';});
function save(){localStorage.setItem(KL,JSON.stringify(L));localStorage.setItem(KC,JSON.stringify(C))}
function render(){
  if(!M.length)return; const m=M[i];
  document.getElementById('img').src=m.file;
  document.getElementById('pos').textContent=(i+1)+' / '+M.length;
  const n=Object.keys(L).length;
  document.getElementById('ndone').textContent=n;
  document.getElementById('ntodo').textContent=M.length-n;
  document.getElementById('fill').style.width=(100*n/M.length)+'%';
  document.getElementById('meta').textContent=
    `image ${m.image} · fold ${m.fold} · ${m.n_px} px · ${m.cls} · overlap ${m.overlap} · in_ext ${m.in_ext}`;
  document.getElementById('note').value = C[m.id]||'';
  const v=L[m.id];
  document.getElementById('cur').innerHTML = v
    ? `label: <span style="color:${v=='A'?'#6bbf7b':v=='B'?'#e06c6c':'#d4b43c'}">${v}</span>`
    : '<span style="color:#9aa0ab">unlabelled</span>';
  ['A','B','C'].forEach(k=>document.getElementById('b'+k).classList.toggle('sel',v===k));
}
function mark(v){ if(!M.length)return; L[M[i].id]=v; save(); if(i<M.length-1)i++; render();
                  document.getElementById('note').blur(); }
function go(d){ i=Math.min(M.length-1,Math.max(0,i+d)); render(); }
function q(s){ s=(s==null?'':String(s)); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function dump(){
  const rows=[['id','file','image','fold','n_px','overlap','cls','in_ext','cy','cx','label','comment']];
  M.forEach(m=>rows.push([m.id,m.file,m.image,m.fold,m.n_px,m.overlap,m.cls,m.in_ext,m.cy,m.cx,
                          L[m.id]||'', C[m.id]||''].map(q)));
  const b=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='fp_review_labels.csv'; a.click();
}
addEventListener('keydown',e=>{
  if(e.target.id==='note'){ if(e.key==='Enter')e.target.blur(); return; }  // don't hijack typing
  const k=e.key.toLowerCase();
  if(k=='a'||k=='b'||k=='c')mark(k.toUpperCase());
  else if(e.key=='ArrowRight')go(1); else if(e.key=='ArrowLeft')go(-1);
});
</script>
